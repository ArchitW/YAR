version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://yar:yar@postgres:5432/yar
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - qdrant
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: yar
      POSTGRES_PASSWORD: yar
      POSTGRES_DB: yar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  pgdata:
  qdrant_data:
